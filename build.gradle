
plugins {
    id 'org.springframework.boot' version '2.2.7.RELEASE'
    id 'io.spring.dependency-management' version '1.0.9.RELEASE'
    id 'java'
    id 'pmd'
    id 'org.openjfx.javafxplugin' version '0.0.8'
}

javafx {
    version = "14"
    modules = [ 'javafx.controls', 'javafx.fxml','javafx.graphics']
}

def defaultEncoding = 'UTF-8'
[compileJava, compileTestJava]*.options*.encoding = defaultEncoding

group = 'com.globant/BrainWaves/ThinkGearReaderFX'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    jcenter()
}

ext {
    set('springCloudVersion', "Hoxton.RC2")
    set('AkkaVersion', "2.6.5")
    set('AlpakkaKafkaVersion', "2.0.2")
}
sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'net.rgielen:javafx-weaver-spring-boot-starter:1.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'com.google.code.gson:gson:2.8.0'
    implementation 'org.openjfx:javafx-controls:14'
    implementation 'org.jfxtras:jmetro:8.6.9'
    implementation 'eu.hansolo:Medusa:11.2'
    implementation 'eu.hansolo:colors:1.4'
    implementation 'org.gillius:jfxutils:1.0'

    implementation "com.typesafe.akka:akka-stream-kafka_2.13:${AlpakkaKafkaVersion}"
    implementation "com.typesafe.akka:akka-stream_2.13:${AkkaVersion}"
    implementation "com.typesafe.akka:akka-actor-typed_2.13:${AkkaVersion}"
    implementation "com.typesafe.akka:akka-actor_2.13:${AkkaVersion}"

    implementation project(":commons")

    implementation("org.springframework.boot:spring-boot-starter-data-jpa"){
        exclude group: "org.apache.tomcat", module: "tomcat-jdbc"
    }
    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
    }
}

tasks.withType(Pmd){
    reports{
        xml.enabled=true
        html.enabled=true
    }
}

pmd {
    ignoreFailures = true
    pmdTest.enabled=false
}